<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        body {
            background: #FFECD7;
        }

        body #prophet_card {
            display: flex;
            margin: auto;
            background: #008DB1;
            border: 5px solid #004E63;
            border-radius: 15px;
            flex-direction: column;
            align-items: center;
            width: 50%;
        }

        #prophet_card img{
            border: 5px solid white;
            border-radius: 15px;
        }

        h1 {
            color: #FFFFFE;
            font-family: Helvetica;
            text-align: center;
        }

        a, h2 {
            margin: auto;
            padding-bottom: 20px;
            color: #91E4FB;
            font-family: Helvetica;
            font-size: 1.2em;
            width: 90%;
            text-align: center;
        }

        #information {
            color: #FFFFFE;
            font-family: Helvetica;
            text-align: center;
        }

        #quote {
            color: #FFD783;
            font-family: 'Brush Script MT';
            font-size: 1.5em;
            width: 60%;
            text-align: center;
        }
    </style>
</head>
<body>
    <section id="prophet_card">
        <h1 id="name">Russell M. Nelson</h1>
        <a href="churchofjesuschrist.org">
        <h2 id="subtitle">17th President of the Church or Jesus Christ of Latter-day Saints</h2>
        </a>
        <img src="images/russell_nelson.png" alt="President Nelson">
        <ul id="information">
            <li>Born: Sep 9, 1924</li>
            <li>Apostle: Apr 7, 1984</li>
            <li>Prophet: Jan 14, 2018</li>
        </ul>
        <p id="quote">"I urge you to devote time each week -- 
            for the rest of your life -- to increase 
            your understanding of the Atonement of 
            Jesus Christ. "</p>
    </section>
</body>
</html>
